<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-cross">✝</span>
      <div>
        <p class="login-label">ADMIN</p>
        <p class="login-name">Ntra. Sra. de la Paz</p>
      </div>
    </div>

    <h1 class="login-title">Iniciar sesión</h1>

    @if (error()) {
      <p class="login-error" role="alert">{{ error() }}</p>
    }

    <form class="login-form" (ngSubmit)="submit()" #f="ngForm">
      <div class="login-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          placeholder="admin@parroquia.cl"
          [disabled]="loading()"
        />
      </div>

      <div class="login-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
          [disabled]="loading()"
        />
      </div>

      <button type="submit" class="login-btn" [disabled]="loading() || !email || !password">
        @if (loading()) { Ingresando… } @else { Ingresar }
      </button>
    </form>
  </div>
</div>
